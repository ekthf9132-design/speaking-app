<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Speaking">
<meta name="theme-color" content="#0f0f0f">
<title>Speaking Practice</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f0f0f;--bg2:#1a1a1a;--bg3:#222;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.14);
  --text:#f0f0f0;--text2:#999;--text3:#555;
  --accent:#4ade80;--accent-dim:rgba(74,222,128,0.12);--accent-border:rgba(74,222,128,0.35);
  --blue:#60a5fa;--blue-dim:rgba(96,165,250,0.1);
  --amber:#fbbf24;--amber-dim:rgba(251,191,36,0.1);
  --red:#f87171;--red-dim:rgba(248,113,113,0.1);
  --purple:#a78bfa;--purple-dim:rgba(167,139,250,0.1);
  --r:12px;--r-sm:8px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column;min-height:100dvh}

.top-bar{display:flex;align-items:center;justify-content:space-between;padding:env(safe-area-inset-top,14px) 16px 10px;border-bottom:0.5px solid var(--border);flex-shrink:0}
.logo{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent);letter-spacing:0.05em}
.top-right{display:flex;align-items:center;gap:8px}
.prog-badge{font-size:11px;color:var(--accent);background:var(--accent-dim);border:0.5px solid var(--accent-border);padding:3px 10px;border-radius:20px;font-family:'DM Mono',monospace}

.tab-bar{display:flex;border-bottom:0.5px solid var(--border);flex-shrink:0}
.tab{flex:1;padding:11px 0;font-size:13px;color:var(--text3);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;font-family:'DM Sans',sans-serif}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.scroll-area{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 100px}

.section-label{font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;margin-bottom:10px;font-family:'DM Mono',monospace}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{font-size:12px;padding:7px 13px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;min-height:36px}
.chip.sel-IM1{background:var(--blue-dim);color:var(--blue);border-color:rgba(96,165,250,0.4);font-weight:500}
.chip.sel-IM2{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border);font-weight:500}
.chip.sel-IM3{background:var(--amber-dim);color:var(--amber);border-color:rgba(251,191,36,0.35);font-weight:500}
.chip.sel-IH{background:rgba(251,146,60,0.1);color:#fb923c;border-color:rgba(251,146,60,0.35);font-weight:500}
.chip.sel-AL{background:var(--purple-dim);color:var(--purple);border-color:rgba(167,139,250,0.35);font-weight:500}
.level-desc{font-size:12px;color:var(--text3);padding:8px 12px;background:var(--bg2);border-radius:var(--r-sm);margin-bottom:16px;line-height:1.6;border:0.5px solid var(--border)}

.paste-box{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:14px}
.paste-title{font-size:12px;color:var(--text2);margin-bottom:8px}
.paste-input{width:100%;font-size:13px;padding:10px 12px;border:0.5px solid var(--border2);border-radius:var(--r-sm);resize:none;min-height:100px;background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.6}
.paste-input::placeholder{color:var(--text3)}
.paste-input:focus{outline:none;border-color:var(--accent-border)}
.parse-btn{width:100%;margin-top:10px;padding:12px;font-size:13px;font-weight:500;border-radius:var(--r-sm);border:0.5px solid var(--accent-border);background:var(--accent-dim);color:var(--accent);cursor:pointer;font-family:'DM Sans',sans-serif}

.prog-wrap{background:var(--bg3);border-radius:20px;height:3px;margin-bottom:14px;overflow:hidden}
.prog-bar{height:3px;border-radius:20px;background:var(--accent);transition:width 0.4s}
.prog-row{display:flex;justify-content:space-between;margin-bottom:5px}
.prog-label{font-size:11px;color:var(--text3)}

.q-list{display:flex;flex-direction:column;gap:12px}
.q-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);overflow:hidden}
.q-card.done{border-color:var(--accent-border)}
.q-head{padding:14px 14px 0}
.q-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.q-num{font-size:10px;font-weight:500;color:var(--accent);background:var(--accent-dim);padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace}
.lvl-badge{font-size:10px;padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace}
.done-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--accent-dim);color:var(--accent);font-family:'DM Mono',monospace}
.q-text{font-size:14px;color:var(--text);line-height:1.65;margin-bottom:12px}

.tips-bar{margin:0 14px 10px;padding:9px 12px;border-radius:0;border-top-right-radius:var(--r-sm);border-bottom-right-radius:var(--r-sm);border-left:2px solid}
.tips-bar.IM1{background:var(--blue-dim);border-color:var(--blue)}
.tips-bar.IM2{background:var(--accent-dim);border-color:var(--accent)}
.tips-bar.IM3{background:var(--amber-dim);border-color:var(--amber)}
.tips-bar.IH{background:rgba(251,146,60,0.08);border-color:#fb923c}
.tips-bar.AL{background:var(--purple-dim);border-color:var(--purple)}
.tips-title{font-size:10px;font-weight:500;margin-bottom:3px;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em}
.tips-bar.IM1 .tips-title{color:var(--blue)}
.tips-bar.IM2 .tips-title{color:var(--accent)}
.tips-bar.IM3 .tips-title{color:var(--amber)}
.tips-bar.IH .tips-title{color:#fb923c}
.tips-bar.AL .tips-title{color:var(--purple)}
.tips-body{font-size:12px;color:var(--text2);line-height:1.5}

.saved-ans{background:var(--bg3);margin:0 14px 8px;border-radius:var(--r-sm);padding:10px 12px}
.saved-ans-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.saved-ans-lbl{font-size:10px;color:var(--text3);font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:0.04em}
.saved-ans-text{font-size:13px;color:var(--text2);line-height:1.6}

.input-area{padding:10px 14px 14px}
.ans-input{width:100%;font-size:14px;padding:11px 12px;border:0.5px solid var(--border2);border-radius:var(--r-sm);resize:none;min-height:80px;background:var(--bg3);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.5}
.ans-input::placeholder{color:var(--text3)}
.ans-input:focus{outline:none;border-color:var(--accent-border)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn-mic{width:46px;height:46px;border-radius:50%;border:0.5px solid var(--border2);background:var(--bg3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-mic.rec{background:var(--red-dim);border-color:var(--red)}
.mic-svg{width:16px;height:16px;fill:var(--text2)}
.btn-mic.rec .mic-svg{fill:var(--red)}
.btn-save{flex:1;font-size:13px;height:46px;border-radius:var(--r-sm);border:0.5px solid var(--accent-border);background:var(--accent-dim);color:var(--accent);cursor:pointer;font-weight:500;font-family:'DM Sans',sans-serif}
.btn-play{height:46px;padding:0 14px;font-size:12px;border-radius:var(--r-sm);border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:6px}
.btn-play.playing{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border)}

.word-hint{font-size:11px;color:var(--text3);margin:0 14px 8px;line-height:1.4}
.model-text{font-size:14px;color:var(--text2);line-height:1.75;user-select:none;-webkit-user-select:none}
.word-span{cursor:pointer;border-radius:3px;padding:1px 1px}
.word-span.saved{background:var(--accent-dim);color:var(--accent)}
.word-span.pressing{background:var(--amber-dim);color:var(--amber)}

.tooltip{position:absolute;z-index:999;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--r);padding:14px;width:230px;pointer-events:none}
.tt-word{font-size:16px;font-weight:500;color:var(--text);margin-bottom:4px;font-family:'DM Mono',monospace}
.tt-meaning{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:10px}
.tt-save{width:100%;font-size:13px;padding:9px 0;border-radius:var(--r-sm);border:0.5px solid var(--accent-border);background:var(--accent-dim);color:var(--accent);cursor:pointer;pointer-events:auto;font-weight:500;font-family:'DM Sans',sans-serif}
.tt-save.saved-state{background:var(--blue-dim);color:var(--blue);border-color:rgba(96,165,250,0.35)}

.vocab-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.vocab-title{font-size:16px;font-weight:500}
.vocab-count{font-size:12px;color:var(--text3);font-family:'DM Mono',monospace}
.vocab-empty{text-align:center;padding:4rem 0;font-size:13px;color:var(--text3)}
.vocab-list{display:flex;flex-direction:column;gap:10px}
.vocab-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px}
.vocab-word{font-size:18px;font-weight:500;font-family:'DM Mono',monospace;margin-bottom:3px}
.vocab-from{font-size:11px;color:var(--text3);margin-bottom:7px}
.vocab-meaning{font-size:13px;color:var(--text2);line-height:1.6;margin-bottom:4px}
.vocab-eg{font-size:12px;color:var(--text3);margin-top:3px;margin-bottom:10px}
.vocab-actions{display:flex;gap:8px}
.vocab-play{font-size:12px;padding:6px 14px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;min-height:34px;font-family:'DM Sans',sans-serif}
.vocab-del{font-size:12px;padding:6px 14px;border-radius:20px;border:0.5px solid rgba(248,113,113,0.3);background:var(--red-dim);color:var(--red);cursor:pointer;min-height:34px;font-family:'DM Sans',sans-serif}

.history-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.history-title{font-size:16px;font-weight:500}
.history-empty{text-align:center;padding:4rem 0;font-size:13px;color:var(--text3)}
.history-list{display:flex;flex-direction:column;gap:10px}
.history-card{background:var(--bg2);border:0.5px solid var(--border);border-radius:var(--r);padding:14px;cursor:pointer}
.history-card:active{background:var(--bg3)}
.hc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.hc-date{font-size:11px;color:var(--text3);font-family:'DM Mono',monospace}
.hc-level{font-size:10px;padding:2px 8px;border-radius:20px;font-family:'DM Mono',monospace}
.hc-q{font-size:13px;color:var(--text2);line-height:1.5;margin-bottom:6px}
.hc-ans{font-size:13px;color:var(--text);line-height:1.5;border-left:2px solid var(--accent);padding-left:10px}
.hc-actions{display:flex;gap:8px;margin-top:10px}
.hc-play{font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid var(--border2);background:var(--bg3);color:var(--text2);cursor:pointer;min-height:32px;font-family:'DM Sans',sans-serif}
.hc-del{font-size:12px;padding:5px 14px;border-radius:20px;border:0.5px solid rgba(248,113,113,0.3);background:var(--red-dim);color:var(--red);cursor:pointer;min-height:32px;font-family:'DM Sans',sans-serif}

.dot::after{content:'...';animation:dots 1.2s steps(3,end) infinite}
@keyframes dots{0%,100%{content:'.'}33%{content:'..'}66%{content:'...'}}
.empty-state{text-align:center;padding:3rem 0;font-size:13px;color:var(--text3)}
</style>
</head>
<body>

<div class="top-bar">
  <span class="logo">speaking.app</span>
  <div class="top-right">
    <span class="prog-badge" id="prog-badge">0 / 0</span>
  </div>
</div>

<div class="tab-bar">
  <button class="tab active" onclick="showTab('practice',this)">연습</button>
  <button class="tab" onclick="showTab('history',this)">기록<span id="hist-cnt-tab"></span></button>
  <button class="tab" onclick="showTab('vocab',this)">단어장<span id="vcnt-tab"></span></button>
</div>

<div class="scroll-area" id="main-scroll">

  <!-- 연습 탭 -->
  <div id="practice-page">
    <div class="section-label" style="margin-top:4px">목표 등급</div>
    <div class="chip-row">
      <button class="chip sel-IM1" onclick="selectLevel('IM1',this)">IM1</button>
      <button class="chip" onclick="selectLevel('IM2',this)">IM2</button>
      <button class="chip" onclick="selectLevel('IM3',this)">IM3</button>
      <button class="chip" onclick="selectLevel('IH',this)">IH</button>
      <button class="chip" onclick="selectLevel('AL',this)">AL</button>
    </div>
    <div class="level-desc" id="level-desc">IM1 — 익숙한 주제에 대해 간단한 문장으로 답변. 2~3문장 목표.</div>

    <div class="paste-box">
      <div class="paste-title">질문 텍스트 붙여넣기</div>
      <textarea class="paste-input" id="paste-input" placeholder="학원 질문지를 복붙하세요.

예시)
1. Explain how technological advancements have affected household chores.
2. What is your favorite household chore?
3. Do you have any memories with your grandparents?"></textarea>
      <button class="parse-btn" onclick="parseQuestions()">질문 카드 생성 →</button>
    </div>

    <div class="prog-row">
      <span class="prog-label" id="prog-label">진행률 0%</span>
    </div>
    <div class="prog-wrap"><div class="prog-bar" id="prog-bar" style="width:0%"></div></div>

    <div class="q-list" id="q-list">
      <div class="empty-state">위에 질문을 붙여넣고 카드를 생성해보세요</div>
    </div>
  </div>

  <!-- 기록 탭 -->
  <div id="history-page" style="display:none">
    <div class="history-header">
      <span class="history-title">연습 기록</span>
      <span class="vocab-count" id="hist-count">0개</span>
    </div>
    <div id="history-list-el"></div>
  </div>

  <!-- 단어장 탭 -->
  <div id="vocab-page" style="display:none">
    <div class="vocab-header">
      <span class="vocab-title">내 단어장</span>
      <span class="vocab-count" id="vocab-count">0개</span>
    </div>
    <div id="vocab-list-el"></div>
  </div>

</div>

<div id="tooltip" style="display:none;position:absolute" class="tooltip">
  <div class="tt-word" id="tt-word"></div>
  <div class="tt-meaning" id="tt-meaning"></div>
  <button class="tt-save" id="tt-save-btn" onclick="saveWordFromTooltip()">단어장에 저장</button>
</div>

<script>
let questions=[], completed=[];
let vocab=JSON.parse(localStorage.getItem('sp_vocab')||'[]');
let history=JSON.parse(localStorage.getItem('sp_history')||'[]');
let currentLevel='IM1';
let activeRec=null, recognition=null, activeTTS=null;
let pressTimer=null, activeWordEl=null, activeWordData=null;

const LC={
  IM1:{desc:'IM1 — 익숙한 주제에 대해 간단한 문장으로 답변. 2~3문장 목표.',tips:'2~3문장 / 기본 시제 정확성 / 단순 연결어 (and, but, so)'},
  IM2:{desc:'IM2 — 구체적인 예시를 포함한 4~5문장. 다양한 시제와 연결어 활용.',tips:'4~5문장 / 예시 1개 이상 / because, when, although 등'},
  IM3:{desc:'IM3 — 자세한 설명과 비교·대조 포함. 5~6문장. 어휘 다양성.',tips:'5~6문장 / 비교·대조 (compared to, whereas) / 구체적 경험'},
  IH:{desc:'IH — 복잡한 주제도 논리적으로 전개. 6~8문장. 고급 어휘.',tips:'6~8문장 / 논리 구조 (서론-본론-결론) / 고급 어휘'},
  AL:{desc:'AL — 원어민 수준. 8문장 이상. 관용어, 뉘앙스, 풍부한 어휘.',tips:'8문장 이상 / 관용어·숙어 자연스럽게 / 복잡한 문장 구조'}
};

function showTab(tab, btn){
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  ['practice','history','vocab'].forEach(t=>{
    document.getElementById(t+'-page').style.display=t===tab?'block':'none';
  });
  if(tab==='vocab') renderVocab();
  if(tab==='history') renderHistory();
  hideTooltip();
  document.getElementById('main-scroll').scrollTop=0;
}

function selectLevel(lv, btn){
  currentLevel=lv;
  document.querySelectorAll('.chip').forEach(b=>{b.className='chip'});
  btn.classList.add('sel-'+lv);
  document.getElementById('level-desc').textContent=LC[lv].desc;
  if(questions.length) renderQuestions();
}

function parseQuestions(){
  const raw=document.getElementById('paste-input').value.trim();
  if(!raw){alert('질문을 먼저 붙여넣어주세요.');return;}
  const lines=raw.split('\n').map(l=>l.trim()).filter(Boolean);
  const parsed=[];
  lines.forEach(line=>{
    const m=line.match(/^[\d]+[.)]\s*(.+)/);
    if(m) parsed.push(m[1].trim());
    else if(line.length>20 && !line.match(/^[\d]+$/)) parsed.push(line);
  });
  if(!parsed.length){alert('질문을 찾지 못했어요.\n1. 2. 3. 형식으로 입력해주세요.');return;}
  questions=parsed;
  completed=new Array(questions.length).fill(false);
  updateProgress();
  renderQuestions();
  document.getElementById('paste-input').value='';
}

function updateProgress(){
  const done=completed.filter(Boolean).length, total=questions.length;
  const pct=total?Math.round(done/total*100):0;
  document.getElementById('prog-badge').textContent=done+' / '+total;
  document.getElementById('prog-label').textContent='진행률 '+pct+'%';
  document.getElementById('prog-bar').style.width=pct+'%';
}

function getBadgeStyle(lv){
  const m={
    IM1:'background:var(--blue-dim);color:var(--blue)',
    IM2:'background:var(--accent-dim);color:var(--accent)',
    IM3:'background:var(--amber-dim);color:var(--amber)',
    IH:'background:rgba(251,146,60,0.1);color:#fb923c',
    AL:'background:var(--purple-dim);color:var(--purple)'
  };
  return m[lv]||'';
}

function saveAnswer(qIdx){
  const ta=document.getElementById('ans-'+qIdx);
  const ans=ta.value.trim();
  if(!ans){alert('먼저 답변을 입력하거나 말해보세요.');return;}
  const record={
    id:Date.now(),
    date:new Date().toLocaleDateString('ko-KR',{month:'short',day:'numeric',weekday:'short'}),
    time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}),
    level:currentLevel,
    question:questions[qIdx],
    answer:ans
  };
  history.unshift(record);
  if(history.length>200) history=history.slice(0,200);
  localStorage.setItem('sp_history',JSON.stringify(history));
  updateHistCount();
  completed[qIdx]=true;
  updateProgress();
  const card=document.getElementById('qcard-'+qIdx);
  if(card) card.classList.add('done');
  const savedBox=document.getElementById('saved-'+qIdx);
  if(savedBox){
    savedBox.style.display='block';
    document.getElementById('saved-text-'+qIdx).textContent=ans;
  }
  ta.value='';
  alert('저장됐어요!');
}

function renderQuestions(){
  const list=document.getElementById('q-list');
  const cfg=LC[currentLevel];
  if(!questions.length){
    list.innerHTML='<div class="empty-state">위에 질문을 붙여넣고 카드를 생성해보세요</div>';
    return;
  }
  list.innerHTML=questions.map((q,i)=>`
    <div class="q-card${completed[i]?' done':''}" id="qcard-${i}">
      <div class="q-head">
        <div class="q-top">
          <span class="q-num">Q${i+1}</span>
          <span class="lvl-badge" style="${getBadgeStyle(currentLevel)}">${currentLevel}</span>
          ${completed[i]?'<span class="done-badge">완료</span>':''}
        </div>
        <div class="q-text">${q}</div>
      </div>
      <div class="tips-bar ${currentLevel}">
        <div class="tips-title">${currentLevel} 목표</div>
        <div class="tips-body">${cfg.tips}</div>
      </div>
      <div class="saved-ans" id="saved-${i}" style="display:${completed[i]?'block':'none'}">
        <div class="saved-ans-top">
          <span class="saved-ans-lbl">저장된 답변</span>
          <button class="btn-play" id="sp-${i}" onclick="playTTS(document.getElementById('saved-text-${i}').textContent,'sp-${i}')">
            <svg width="9" height="10" viewBox="0 0 9 10" fill="currentColor"><polygon points="0,0 9,5 0,10"/></svg> 듣기
          </button>
        </div>
        <div class="saved-ans-text" id="saved-text-${i}">${completed[i]&&history.find(h=>h.question===q)?history.find(h=>h.question===q).answer:''}</div>
      </div>
      <div class="input-area">
        <textarea class="ans-input" id="ans-${i}" placeholder="영어로 답변을 입력하거나 마이크로 말해보세요..."></textarea>
        <div class="btn-row">
          <button class="btn-mic" id="mic-${i}" onclick="toggleMic(${i})">
            <svg class="mic-svg" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm6 9a6 6 0 0 1-12 0H4a8 8 0 0 0 7 7.93V20H8v2h8v-2h-3v-2.07A8 8 0 0 0 20 10h-2z"/></svg>
          </button>
          <button class="btn-save" onclick="saveAnswer(${i})">저장하기</button>
          <button class="btn-play" id="mp-${i}" onclick="playTTS(document.getElementById('ans-${i}').value,'mp-${i}')">
            <svg width="9" height="10" viewBox="0 0 9 10" fill="currentColor"><polygon points="0,0 9,5 0,10"/></svg> 듣기
          </button>
        </div>
      </div>
    </div>`).join('');
}

function toggleMic(qIdx){
  const btn=document.getElementById('mic-'+qIdx), ta=document.getElementById('ans-'+qIdx);
  if(!('webkitSpeechRecognition' in window||'SpeechRecognition' in window)){
    alert('사파리에서 마이크 사용하려면\n설정 > Safari > 마이크 허용\n후 다시 시도해주세요.');return;
  }
  if(activeRec===qIdx){recognition&&recognition.stop();activeRec=null;btn.classList.remove('rec');return;}
  if(activeRec!==null){recognition&&recognition.stop();const p=document.getElementById('mic-'+activeRec);if(p)p.classList.remove('rec');}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();
  recognition.lang='en-US';recognition.continuous=true;recognition.interimResults=true;
  recognition.onresult=function(ev){
    let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;
    ta.value=t;
  };
  recognition.onend=function(){btn.classList.remove('rec');activeRec=null;};
  recognition.onerror=function(){btn.classList.remove('rec');activeRec=null;};
  recognition.start();activeRec=qIdx;btn.classList.add('rec');
}

function playTTS(text, id){
  if(!text||!text.trim()){return;}
  if(activeTTS){
    window.speechSynthesis.cancel();
    const p=document.getElementById(activeTTS);
    if(p) p.classList.remove('playing');
    if(activeTTS===id){activeTTS=null;return;}
  }
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US';u.rate=0.88;u.pitch=1;
  const voices=window.speechSynthesis.getVoices();
  const enVoice=voices.find(v=>v.lang.startsWith('en')&&v.name.includes('Samantha'))||
                voices.find(v=>v.lang.startsWith('en-US'))||
                voices.find(v=>v.lang.startsWith('en'));
  if(enVoice) u.voice=enVoice;
  const btn=document.getElementById(id);if(btn)btn.classList.add('playing');
  activeTTS=id;
  u.onend=()=>{if(btn)btn.classList.remove('playing');activeTTS=null;};
  u.onerror=()=>{if(btn)btn.classList.remove('playing');activeTTS=null;};
  window.speechSynthesis.speak(u);
}

function renderHistory(){
  updateHistCount();
  const el=document.getElementById('history-list-el');
  if(!history.length){el.innerHTML='<div class="history-empty">연습 후 저장하면 기록이 쌓여요</div>';return;}
  el.innerHTML='<div class="history-list">'+history.map((r,i)=>`
    <div class="history-card">
      <div class="hc-top">
        <span class="hc-date">${r.date} ${r.time||''}</span>
        <span class="hc-level" style="${getBadgeStyle(r.level)}">${r.level}</span>
      </div>
      <div class="hc-q">${r.question}</div>
      <div class="hc-ans">${r.answer}</div>
      <div class="hc-actions">
        <button class="hc-play" onclick="playTTS('${r.answer.replace(/'/g,"\\'")}','hp-${i}')">발음 듣기</button>
        <button class="hc-del" onclick="deleteHistory(${i})">삭제</button>
      </div>
    </div>`).join('')+'</div>';
}

function deleteHistory(i){
  if(!confirm('이 기록을 삭제할까요?'))return;
  history.splice(i,1);
  localStorage.setItem('sp_history',JSON.stringify(history));
  updateHistCount();renderHistory();
}

function updateHistCount(){
  const n=history.length;
  document.getElementById('hist-cnt-tab').textContent=n>0?' ('+n+')':'';
  document.getElementById('hist-count').textContent=n+'개';
}

function makeWordSpans(text){
  return text.split(/(\s+)/).map(part=>{
    if(/^\s+$/.test(part))return part;
    const clean=part.replace(/[^a-zA-Z']/g,'');
    if(!clean)return part;
    const punct=part.slice(clean.length);
    const isSaved=vocab.some(v=>v.word.toLowerCase()===clean.toLowerCase());
    return `<span class="word-span${isSaved?' saved':''}" data-word="${clean}"
      ontouchstart="startPress(event,this,'${clean}')"
      ontouchend="cancelPress()"
      ontouchmove="cancelPress()"
      onmousedown="startPress(event,this,'${clean}')"
      onmouseup="cancelPress()"
      onmouseleave="cancelPress()">${clean}</span>${punct}`;
  }).join('');
}

function startPress(e, el, word){
  cancelPress();
  el.classList.add('pressing');activeWordEl=el;
  pressTimer=setTimeout(()=>{
    el.classList.remove('pressing');
    showWordTooltip(e, el, word);
  },600);
}
function cancelPress(){
  if(pressTimer){clearTimeout(pressTimer);pressTimer=null;}
  if(activeWordEl){activeWordEl.classList.remove('pressing');activeWordEl=null;}
}

function showWordTooltip(e, el, word){
  const tt=document.getElementById('tooltip');
  document.getElementById('tt-word').textContent=word;
  document.getElementById('tt-meaning').textContent='단어를 직접 검색해서 추가해보세요';
  const alreadySaved=vocab.some(v=>v.word.toLowerCase()===word.toLowerCase());
  const sb=document.getElementById('tt-save-btn');
  sb.textContent=alreadySaved?'이미 저장됨':'단어장에 저장';
  sb.className='tt-save'+(alreadySaved?' saved-state':'');
  activeWordData={word, meaning:'', example:'', from:'질문지'};
  const scrollTop=document.getElementById('main-scroll').scrollTop;
  const rect=el.getBoundingClientRect();
  const scrollRect=document.getElementById('main-scroll').getBoundingClientRect();
  let top=rect.bottom-scrollRect.top+scrollTop+6;
  let left=Math.max(8,rect.left-scrollRect.left);
  tt.style.display='block';
  if(left+234>scrollRect.width-8)left=Math.max(8,scrollRect.width-242);
  tt.style.top=top+'px';tt.style.left=left+'px';
  setTimeout(()=>{
    document.addEventListener('touchstart',outsideClose,{once:true,capture:true});
    document.addEventListener('mousedown',outsideClose,{once:true,capture:true});
  },100);
}

function outsideClose(e){if(!document.getElementById('tooltip').contains(e.target))hideTooltip();}
function hideTooltip(){document.getElementById('tooltip').style.display='none';}

function saveWordFromTooltip(){
  if(!activeWordData)return;
  if(vocab.some(v=>v.word.toLowerCase()===activeWordData.word.toLowerCase())){hideTooltip();return;}
  vocab.push({word:activeWordData.word,meaning:'(뜻 직접 입력)',example:'',from:activeWordData.from,date:new Date().toLocaleDateString('ko-KR')});
  localStorage.setItem('sp_vocab',JSON.stringify(vocab));
  updateVocabCount();
  document.getElementById('tt-save-btn').textContent='저장됨!';
  document.getElementById('tt-save-btn').className='tt-save saved-state';
  document.querySelectorAll('.word-span').forEach(s=>{
    if(s.dataset.word&&s.dataset.word.toLowerCase()===activeWordData.word.toLowerCase())s.classList.add('saved');
  });
  setTimeout(hideTooltip,500);
}

function updateVocabCount(){
  const n=vocab.length;
  document.getElementById('vcnt-tab').textContent=n>0?' ('+n+')':'';
  document.getElementById('vocab-count').textContent=n+'개';
}

function renderVocab(){
  updateVocabCount();
  const el=document.getElementById('vocab-list-el');
  if(!vocab.length){el.innerHTML='<div class="vocab-empty">모르는 단어를 길게 눌러서 저장해보세요</div>';return;}
  el.innerHTML='<div class="vocab-list">'+vocab.map((v,i)=>`
    <div class="vocab-card">
      <div class="vocab-word">${v.word}</div>
      <div class="vocab-from">${v.from} · ${v.date}</div>
      <div class="vocab-meaning">${v.meaning}${v.example?'<div class="vocab-eg">e.g. '+v.example+'</div>':''}</div>
      <div class="vocab-actions">
        <button class="vocab-play" onclick="playTTS('${v.word}','vp${i}')">발음 듣기</button>
        <button class="vocab-del" onclick="deleteVocab(${i})">삭제</button>
      </div>
    </div>`).join('')+'</div>';
}

function deleteVocab(i){
  vocab.splice(i,1);
  localStorage.setItem('sp_vocab',JSON.stringify(vocab));
  updateVocabCount();renderVocab();
}

window.speechSynthesis.onvoiceschanged=function(){};
updateVocabCount();
updateHistCount();
</script>
</body>
</html>
